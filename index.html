<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LivingGPT - In-Browser AI Agent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .agent-container {
      width: 100%;
      max-width: 850px;
      height: 100%;
      height: 100dvh;
      background: #111827;
      display: flex;
      flex-direction: column;
      border: 1px solid #1f2937;
    }

    @media (min-width: 768px) {
      .agent-container {
        height: 92vh;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
    }

    .header {
      padding: 14px 18px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #eab308;
      border-radius: 50%;
      box-shadow: 0 0 8px #eab308;
      flex-shrink: 0;
    }

    .status-dot.ready {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.busy {
      background-color: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* Model Download Bar */
    .download-panel {
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .download-bar-bg {
      width: 100%;
      height: 6px;
      background: #0f172a;
      border-radius: 3px;
      overflow: hidden;
    }

    .download-bar-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }

    .chat-box {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }

    .agent {
      align-self: flex-start;
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    details.thought-dropdown {
      background: #0d1424;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    details.thought-dropdown summary {
      cursor: pointer;
      color: #94a3b8;
      font-weight: 500;
      outline: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .thought-logs {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #1e293b;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 11px;
    }

    .log-item { color: #93c5fd; }
    .log-action { color: #38bdf8; }
    .log-obs { color: #34d399; }

    .input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #0f172a;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }

    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="agent-container">
    <div class="header">
      <div class="agent-info">
        <div id="statusDot" class="status-dot"></div>
        <div>
          <strong style="font-size: 15px;">LivingGPT (Local Neural Core)</strong>
          <div style="font-size: 11px; color: #9ca3af;" id="agentState">Initializing Neural Engine...</div>
        </div>
      </div>
    </div>

    <!-- Storage & Download Progress Panel -->
    <div class="download-panel" id="downloadPanel">
      <div style="display: flex; justify-content: space-between;">
        <span id="downloadStatus">Checking persistent storage...</span>
        <span id="downloadPercent">0%</span>
      </div>
      <div class="download-bar-bg">
        <div class="download-bar-fill" id="downloadFill"></div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message agent">
        <div class="response-text">
          LivingGPT is preparing its neural weights. Once loaded into local storage, all reasoning and agent decisions happen directly on your device.
        </div>
      </div>
    </div>

    <form class="input-area" id="agentForm">
      <input type="text" id="userInput" placeholder="Waiting for model to load..." disabled autocomplete="off" />
      <button type="submit" id="submitBtn" disabled>Run</button>
    </form>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // Enable browser cache (IndexedDB / CacheStorage) so weights download only once
    env.useBrowserCache = true;
    env.allowLocalModels = false;

    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const form = document.getElementById('agentForm');
    const statusDot = document.getElementById('statusDot');
    const agentState = document.getElementById('agentState');
    const submitBtn = document.getElementById('submitBtn');
    const downloadPanel = document.getElementById('downloadPanel');
    const downloadStatus = document.getElementById('downloadStatus');
    const downloadPercent = document.getElementById('downloadPercent');
    const downloadFill = document.getElementById('downloadFill');

    let generator = null;
    const MODEL_ID = 'onnx-community/Qwen2.5-0.5B-Instruct';

    // Tool Registry
    const AgentTools = {
      calculator: async (expr) => {
        try {
          const cleanExpr = expr.replace(/[^0-9+\-*/().]/g, '');
          const res = Function(`'use strict'; return (${cleanExpr})`)();
          return `${expr} = ${res}`;
        } catch {
          return "Calculation error";
        }
      },
      web_search: async (query) => {
        try {
          const endpoint = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query.trim())}`;
          const res = await fetch(endpoint);
          if (res.ok) {
            const data = await res.json();
            if (data.extract) return data.extract;
          }
          return `No direct summary found for '${query}'.`;
        } catch (e) {
          return `Lookup failed: ${e.message}`;
        }
      },
      env_check: async () => {
        return `Current Time: ${new Date().toLocaleTimeString()}, Date: ${new Date().toLocaleDateString()}`;
      }
    };

    // Initialize Local Model with Caching & Progress
    async function initModel() {
      const isCached = localStorage.getItem('livinggpt_model_cached') === 'true';
      downloadStatus.textContent = isCached 
        ? 'Loading neural weights from local browser storage...' 
        : 'Downloading neural weights (cached permanently after)...';

      try {
        generator = await pipeline('text-generation', MODEL_ID, {
          dtype: 'q4',
          progress_callback: (progress) => {
            if (progress.status === 'progress') {
              const p = Math.round(progress.progress || 0);
              downloadPercent.textContent = `${p}%`;
              downloadFill.style.width = `${p}%`;
              downloadStatus.textContent = `Downloading ${progress.file || 'weights'}...`;
            }
          }
        });

        localStorage.setItem('livinggpt_model_cached', 'true');
        downloadPanel.style.display = 'none';

        statusDot.className = 'status-dot ready';
        agentState.textContent = 'Neural brain ready (Offline Cached)';
        input.disabled = false;
        submitBtn.disabled = false;
        input.placeholder = 'Give LivingGPT an objective...';
      } catch (err) {
        downloadStatus.textContent = `Init failed: ${err.message}`;
        agentState.textContent = 'Engine Error';
      }
    }

    initModel();

    // The True Neural ReAct Loop
    async function runNeuralAgent(goal, logCollector) {
      logCollector.addThought(`Goal received: "${goal}"`);
      logCollector.addThought(`Prompting local neural model to select action...`);

      const systemPrompt = `<|im_start|>system
You are LivingGPT, an autonomous AI agent. Decide which tool to call based on the user's objective:
- ACTION: calculator("expression")
- ACTION: web_search("subject")
- ACTION: env_check()
- FINAL: direct conversational answer

Answer strictly with either an ACTION line or a FINAL line.<|im_end|>
<|im_start|>user
Objective: ${goal}<|im_end|>
<|im_start|>assistant
`;

      const output = await generator(systemPrompt, {
        max_new_tokens: 48,
        temperature: 0.1,
        return_full_text: false
      });

      const decision = output[0].generated_text.trim();
      logCollector.addThought(`Neural core output: ${decision}`);

      // Parse Neural Decision
      let observation = null;

      if (decision.includes('ACTION: calculator')) {
        const match = decision.match(/calculator\((?:'|")?(.*?)(?:'|")?\)/);
        const expr = match ? match[1] : goal;
        logCollector.addAction(`calculator("${expr}")`);
        observation = await AgentTools.calculator(expr);
      } else if (decision.includes('ACTION: web_search')) {
        const match = decision.match(/web_search\((?:'|")?(.*?)(?:'|")?\)/);
        const query = match ? match[1] : goal;
        logCollector.addAction(`web_search("${query}")`);
        observation = await AgentTools.web_search(query);
      } else if (decision.includes('ACTION: env_check')) {
        logCollector.addAction(`env_check()`);
        observation = await AgentTools.env_check();
      }

      // If a tool was triggered, synthesize the final answer
      if (observation) {
        logCollector.addObs(observation);
        logCollector.addThought(`Synthesizing answer from tool observation...`);
        return observation;
      }

      // If the neural model provided a direct answer
      return decision.replace(/^FINAL:\s*/i, '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const goal = input.value.trim();
      if (!goal || !generator) return;

      appendMessage(goal, 'user');
      input.value = '';

      statusDot.className = 'status-dot busy';
      agentState.textContent = 'Neural loop executing...';
      submitBtn.disabled = true;

      const { logCollector, setText } = createAgentMessage();

      try {
        const result = await runNeuralAgent(goal, logCollector);
        setText(result);
      } catch (err) {
        setText(`Execution halted: ${err.message}`);
      } finally {
        statusDot.className = 'status-dot ready';
        agentState.textContent = 'Neural brain ready';
        submitBtn.disabled = false;
      }
    });

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createAgentMessage() {
      const card = document.createElement('div');
      card.className = 'message agent';

      const details = document.createElement('details');
      details.className = 'thought-dropdown';
      details.open = true;

      const summary = document.createElement('summary');
      summary.innerHTML = '🧠 Neural Agent Reasoning';
      details.appendChild(summary);

      const logContainer = document.createElement('div');
      logContainer.className = 'thought-logs';
      details.appendChild(logContainer);

      const responseEl = document.createElement('div');
      responseEl.innerHTML = '<i>Processing neural tokens...</i>';

      card.appendChild(details);
      card.appendChild(responseEl);
      chatBox.appendChild(card);
      chatBox.scrollTop = chatBox.scrollHeight;

      const logCollector = {
        addThought: (t) => addLog(`💭 ${t}`, 'log-item'),
        addAction: (a) => addLog(`🛠️ Action: ${a}`, 'log-action'),
        addObs: (o) => addLog(`👁️ Obs: ${o}`, 'log-obs')
      };

      function addLog(text, className) {
        const item = document.createElement('div');
        item.className = className;
        item.textContent = text;
        logContainer.appendChild(item);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function setText(text) {
        responseEl.textContent = text;
        details.open = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      return { logCollector, setText };
    }
  </script>
</body>
</html>
