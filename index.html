<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LivingGPT - Autonomous Agent Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .agent-container {
      width: 100%;
      max-width: 900px;
      height: 100%;
      height: 100dvh;
      background: #111827;
      display: flex;
      flex-direction: column;
      border: 1px solid #1f2937;
      position: relative;
    }

    @media (min-width: 768px) {
      .agent-container {
        height: 90vh;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
    }

    .header {
      padding: 14px 18px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      flex-shrink: 0;
    }

    .status-dot.busy {
      background-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .chat-box {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.4;
      font-size: 14px;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }

    .agent {
      align-self: flex-start;
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
    }

    .thought-bubble {
      max-width: 90%;
      align-self: flex-start;
      background: #182234;
      border-left: 3px solid #60a5fa;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #93c5fd;
      font-family: monospace;
    }

    .tool-call {
      font-family: monospace;
      font-size: 12px;
      background: #030712;
      border: 1px solid #1f2937;
      border-left: 3px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 4px;
      color: #cbd5e1;
      max-width: 90%;
      align-self: flex-start;
      word-break: break-all;
    }

    .tool-call.result {
      border-left-color: #34d399;
      color: #a7f3d0;
    }

    .tool-call.retry {
      border-left-color: #f97316;
      color: #fed7aa;
    }

    .input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #0f172a;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }

    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="agent-container">
    <div class="header">
      <div class="agent-info">
        <div id="statusDot" class="status-dot"></div>
        <div>
          <strong style="font-size: 15px;">LivingGPT (Autonomous Engine)</strong>
          <div style="font-size: 11px; color: #9ca3af;" id="agentState">Autonomous loop: idle</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message agent">
        LivingGPT Autonomous Agent ready. Multi-step reasoning, query normalization, retry loops, and adaptive tools enabled.
      </div>
    </div>

    <form class="input-area" id="agentForm">
      <input type="text" id="userInput" placeholder="Give LivingGPT an objective..." autocomplete="off" />
      <button type="submit" id="submitBtn">Execute</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const form = document.getElementById('agentForm');
    const statusDot = document.getElementById('statusDot');
    const agentState = document.getElementById('agentState');
    const submitBtn = document.getElementById('submitBtn');

    // Tool Registry with execution feedback
    const AgentTools = {
      calculator: {
        name: "calculator",
        execute: async (expr) => {
          try {
            const cleanExpr = expr.replace(/[^0-9+\-*/().]/g, '');
            const res = Function(`'use strict'; return (${cleanExpr})`)();
            return { success: true, quality: "high", output: res };
          } catch (e) {
            return { success: false, quality: "low", output: "Calculation failed" };
          }
        }
      },
      web_search: {
        name: "web_search",
        execute: async (query) => {
          try {
            const endpoint = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
            const res = await fetch(endpoint);
            const data = await res.json();
            if (data.AbstractText) {
              return { success: true, quality: "high", output: data.AbstractText };
            }
            if (data.RelatedTopics && data.RelatedTopics[0]?.Text) {
              return { success: true, quality: "high", output: data.RelatedTopics[0].Text };
            }
            return { success: false, quality: "low", output: "No direct extract found" };
          } catch (err) {
            return { success: false, quality: "low", output: err.message };
          }
        }
      },
      wikipedia_lookup: {
        name: "wikipedia_lookup",
        execute: async (query) => {
          try {
            const cleanQuery = query.replace(/(who is|what is|where is|search|lookup)/gi, '').trim();
            const endpoint = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`;
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error("Article not found");
            const data = await res.json();
            if (data.extract) {
              return { success: true, quality: "high", output: data.extract };
            }
            return { success: false, quality: "low", output: "No article summary" };
          } catch (e) {
            return { success: false, quality: "low", output: e.message };
          }
        }
      },
      env_check: {
        name: "env_check",
        execute: async () => {
          return {
            success: true,
            quality: "high",
            output: `Local Time: ${new Date().toLocaleTimeString()}, Date: ${new Date().toLocaleDateString()}`
          };
        }
      }
    };

    // Query Preprocessor & Math Normalizer
    function parseIntent(rawGoal) {
      let normalized = rawGoal
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\bplus\b/gi, '+')
        .replace(/\bminus\b/gi, '-')
        .replace(/\btimes\b|\bmultiplied by\b/gi, '*')
        .replace(/\bdivided by\b/gi, '/');

      const mathMatch = normalized.match(/(\d+(\.\d+)?\s*[\+\-\*\/]\s*\d+(\.\d+)?)/);
      const asksTime = /\b(time|date|today|clock|day)\b/i.test(rawGoal);

      return {
        isMath: !!mathMatch,
        mathExpr: mathMatch ? mathMatch[0] : null,
        isTime: asksTime,
        cleanSearch: rawGoal.replace(/^(who is|what is|search|lookup|find)\s+/i, '').trim()
      };
    }

    // Dynamic ReAct Agent Engine with Tool Retries
    async function runAgentReActLoop(goal) {
      appendThought(`Analyzing goal: "${goal}"`);
      const intent = parseIntent(goal);
      const observations = [];

      // 1. Math branch
      if (intent.isMath) {
        appendThought(`Detected arithmetic expression: "${intent.mathExpr}"`);
        appendToolCall(`calculator("${intent.mathExpr}")`);
        await new Promise(r => setTimeout(r, 450));

        const res = await AgentTools.calculator.execute(intent.mathExpr);
        appendObservation(`Result: ${res.output}`);
        observations.push({ type: "math", result: `${intent.mathExpr} = ${res.output}` });
      }

      // 2. System / Time branch
      if (intent.isTime) {
        appendThought(`Detected environment/temporal intent.`);
        appendToolCall(`env_check()`);
        await new Promise(r => setTimeout(r, 450));

        const res = await AgentTools.env_check.execute();
        appendObservation(res.output);
        observations.push({ type: "time", result: res.output });
      }

      // 3. Information retrieval with autonomous fallback loop
      if (!intent.isMath && !intent.isTime) {
        appendThought(`Knowledge intent identified. Strategy: Primary tool [web_search]`);
        appendToolCall(`web_search("${intent.cleanSearch}")`);
        await new Promise(r => setTimeout(r, 500));

        let res = await AgentTools.web_search.execute(intent.cleanSearch);

        // Self-Evaluation & Autonomous Pivot
        if (!res.success || res.quality === "low") {
          appendThought(`Observation quality insufficient. Activating fallback tool: [wikipedia_lookup]`);
          appendRetryCall(`Switching agent strategy -> wikipedia_lookup("${intent.cleanSearch}")`);
          await new Promise(r => setTimeout(r, 600));

          res = await AgentTools.wikipedia_lookup.execute(intent.cleanSearch);
        }

        if (res.success) {
          appendObservation(`Retrieved: ${res.output}`);
          observations.push({ type: "knowledge", result: res.output });
        } else {
          appendObservation(`All search tools exhausted without definitive summary.`);
          observations.push({ type: "knowledge", result: `No instant extract found for "${intent.cleanSearch}".` });
        }
      }

      // 4. Natural Synthesis
      appendThought(`Sub-actions completed. Synthesizing final response.`);
      return synthesizeResponse(observations);
    }

    function synthesizeResponse(observations) {
      const parts = [];
      for (const obs of observations) {
        if (obs.type === "math") parts.push(`The answer is **${obs.result}**.`);
        else if (obs.type === "time") parts.push(`Current context: ${obs.result}.`);
        else if (obs.type === "knowledge") parts.push(obs.result);
      }
      return parts.join("\n\n");
    }

    // UI Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const goal = input.value.trim();
      if (!goal) return;

      appendMessage(goal, 'user');
      input.value = '';
      setBusy(true);

      try {
        const finalResponse = await runAgentReActLoop(goal);
        appendMessage(finalResponse, 'agent');
      } catch (err) {
        appendMessage(`Agent cycle interrupted: ${err.message}`, 'agent');
      } finally {
        setBusy(false);
      }
    });

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendThought(thought) {
      const el = document.createElement('div');
      el.className = 'thought-bubble';
      el.textContent = `🧠 [Reasoning] ${thought}`;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendToolCall(details) {
      const el = document.createElement('div');
      el.className = 'tool-call';
      el.textContent = `🛠️ Action: ${details}`;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendRetryCall(details) {
      const el = document.createElement('div');
      el.className = 'tool-call retry';
      el.textContent = `🔄 Pivot: ${details}`;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendObservation(obs) {
      const el = document.createElement('div');
      el.className = 'tool-call result';
      el.textContent = `👁️ Observation: ${obs}`;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setBusy(isBusy) {
      if (isBusy) {
        statusDot.classList.add('busy');
        agentState.textContent = 'Agent executing loop...';
        submitBtn.disabled = true;
      } else {
        statusDot.classList.remove('busy');
        agentState.textContent = 'Autonomous loop: idle';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
