<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .agent-container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 1px solid #334155;
    }

    .header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.busy {
      background-color: #eab308;
      box-shadow: 0 0 8px #eab308;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
    }

    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }

    .agent {
      align-self: flex-start;
      background-color: #334155;
      color: #f1f5f9;
    }

    .tool-call {
      font-family: monospace;
      font-size: 12px;
      background: #0b1120;
      border-left: 3px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 6px;
      color: #94a3b8;
    }

    .input-area {
      padding: 16px 20px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="agent-container">
    <div class="header">
      <div class="agent-info">
        <div id="statusDot" class="status-dot"></div>
        <div>
          <strong id="agentName">Autonomous Agent</strong>
          <div style="font-size: 12px; color: #94a3b8;" id="agentState">Idle</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message agent">
        Agent initialized and ready. Give me a goal or a task to execute.
      </div>
    </div>

    <form class="input-area" id="agentForm">
      <input type="text" id="userInput" placeholder="Give the agent an objective..." autocomplete="off" />
      <button type="submit">Run</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('agentForm');
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const statusDot = document.getElementById('statusDot');
    const agentState = document.getElementById('agentState');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const task = input.value.trim();
      if (!task) return;

      appendMessage(task, 'user');
      input.value = '';

      setBusy(true);

      // Simulated agent chain / tool invocation
      setTimeout(() => {
        appendToolCall(`Running action: web_search(query="${task}")`);
      }, 1000);

      setTimeout(() => {
        appendMessage(`Finished processing task: "${task}". Results evaluated and updated.`, 'agent');
        setBusy(false);
      }, 2500);
    });

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendToolCall(toolDetails) {
      const toolDiv = document.createElement('div');
      toolDiv.className = 'tool-call';
      toolDiv.textContent = `⚙️ [Agent Execution] ${toolDetails}`;
      chatBox.appendChild(toolDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setBusy(isBusy) {
      if (isBusy) {
        statusDot.classList.add('busy');
        agentState.textContent = 'Thinking & Executing tools...';
      } else {
        statusDot.classList.remove('busy');
        agentState.textContent = 'Idle';
      }
    }
  </script>
</body>
</html>
