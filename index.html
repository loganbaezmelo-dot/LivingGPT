<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LivingGPT - N-Gram Statistical Agent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .agent-container {
      width: 100%;
      max-width: 850px;
      height: 100%;
      height: 100dvh;
      background: #111827;
      display: flex;
      flex-direction: column;
      border: 1px solid #1f2937;
    }

    @media (min-width: 768px) {
      .agent-container {
        height: 92vh;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
    }

    .header {
      padding: 14px 18px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      flex-shrink: 0;
    }

    .status-dot.busy {
      background-color: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }

    .chat-box {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }

    .agent {
      align-self: flex-start;
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    details.thought-dropdown {
      background: #0d1424;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    details.thought-dropdown summary {
      cursor: pointer;
      color: #94a3b8;
      font-weight: 500;
      outline: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .thought-logs {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #1e293b;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 11px;
    }

    .log-item { color: #93c5fd; }
    .log-action { color: #38bdf8; }
    .log-obs { color: #34d399; }

    .input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #0f172a;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="agent-container">
    <div class="header">
      <div class="agent-info">
        <div id="statusDot" class="status-dot"></div>
        <div>
          <strong style="font-size: 15px;">LivingGPT (N-Gram Core)</strong>
          <div style="font-size: 11px; color: #9ca3af;" id="agentState">Statistical Engine Ready (0ms latency)</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message agent">
        <div class="response-text">
          LivingGPT initialized with a custom client-side Bi-gram / Tri-gram language model. Zero server dependencies, zero mobile freezes, instant probability-based tool selection.
        </div>
      </div>
    </div>

    <form class="input-area" id="agentForm">
      <input type="text" id="userInput" placeholder="Ask LivingGPT anything..." autocomplete="off" />
      <button type="submit" id="submitBtn">Run</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const form = document.getElementById('agentForm');
    const statusDot = document.getElementById('statusDot');
    const agentState = document.getElementById('agentState');
    const submitBtn = document.getElementById('submitBtn');

    // 1. Tool Registry
    const AgentTools = {
      calculator: async (raw) => {
        try {
          const expr = raw.replace(/[^0-9+\-*/().]/g, '');
          const res = Function(`'use strict'; return (${expr})`)();
          return `${expr} = ${res}`;
        } catch {
          return "Calculation error";
        }
      },
      web_search: async (query) => {
        try {
          const clean = query.replace(/(who is|what is|search|lookup|find)/gi, '').trim();
          const endpoint = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(clean)}`;
          const res = await fetch(endpoint);
          if (res.ok) {
            const data = await res.json();
            if (data.extract) return data.extract;
          }
          return `No instant summary found for '${clean}'.`;
        } catch (e) {
          return `Search error: ${e.message}`;
        }
      },
      env_check: async () => {
        return `Local Time: ${new Date().toLocaleTimeString()}, Date: ${new Date().toLocaleDateString()}`;
      }
    };

    // 2. Custom N-Gram Language Model Class
    class NGramModel {
      constructor(n = 2) {
        this.n = n;
        this.counts = {}; // Frequency tables: P(w_n | w_prev)
      }

      tokenize(text) {
        return text.toLowerCase()
          .replace(/[×*]/g, ' multiply ')
          .replace(/[÷/]/g, ' divide ')
          .replace(/\+/g, ' plus ')
          .replace(/-/g, ' minus ')
          .replace(/[^\w\s]/g, ' ')
          .trim()
          .split(/\s+/)
          .filter(Boolean);
      }

      train(corpus) {
        for (const sample of corpus) {
          const tokens = ['<s>', ...this.tokenize(sample.text), '</s>'];
          for (let i = 0; i < tokens.length - 1; i++) {
            const context = tokens[i];
            const nextWord = tokens[i + 1];

            if (!this.counts[context]) this.counts[context] = {};
            if (!this.counts[context][nextWord]) this.counts[context][nextWord] = 0;
            this.counts[context][nextWord]++;
          }
        }
      }

      // Calculate sequence score / likelihood for class intent
      scoreSequence(tokens, targetClassKeywords) {
        let score = 0;
        for (const token of tokens) {
          if (targetClassKeywords.includes(token)) score += 2.0;
          if (this.counts[token]) {
            for (const key of targetClassKeywords) {
              if (this.counts[token][key]) {
                score += (this.counts[token][key] / 10);
              }
            }
          }
        }
        return score;
      }
    }

    // 3. Corpus & Training
    const nGramEngine = new NGramModel(2);
    const trainingCorpus = [
      { text: "calculate math sum plus minus multiply divide solve times" },
      { text: "what is the time current clock hour minute today date" },
      { text: "who is what is explain lookup search wiki biography where is" },
      { text: "hello hi greetings hey good morning sup yo" }
    ];
    nGramEngine.train(trainingCorpus);

    // 4. Statistical Agent Decision Loop
    async function runNGramAgent(goal, logCollector) {
      logCollector.addThought(`Tokenizing goal: "${goal}"`);
      const tokens = nGramEngine.tokenize(goal);
      logCollector.addThought(`Tokens: [${tokens.join(', ')}]`);

      // Evaluate probabilistic scores across tool spaces
      const mathScore = nGramEngine.scoreSequence(tokens, ['multiply', 'divide', 'plus', 'minus', 'calculate', 'solve']) + (/\d+/.test(goal) ? 2.5 : 0);
      const timeScore = nGramEngine.scoreSequence(tokens, ['time', 'date', 'clock', 'today', 'hour']);
      const greetingScore = nGramEngine.scoreSequence(tokens, ['hi', 'hello', 'hey', 'greetings', 'yo']);
      const searchScore = nGramEngine.scoreSequence(tokens, ['who', 'what', 'where', 'lookup', 'search', 'explain', 'wiki']) + 1.0;

      logCollector.addThought(`P(Math): ${mathScore.toFixed(2)} | P(Time): ${timeScore.toFixed(2)} | P(Greet): ${greetingScore.toFixed(2)} | P(Search): ${searchScore.toFixed(2)}`);

      // Greet class
      if (greetingScore > mathScore && greetingScore > timeScore && greetingScore > searchScore && tokens.length <= 3) {
        logCollector.addThought(`Highest probability: conversational greeting.`);
        return "Hey! LivingGPT is ready. Give me an objective, search query, or calculation.";
      }

      // Math tool
      if (mathScore > timeScore && mathScore > searchScore) {
        logCollector.addThought(`Classified as arithmetic intent.`);
        const exprMatch = goal.replace(/×/g, '*').replace(/÷/g, '/').match(/(\d+(\.\d+)?\s*[\+\-\*\/]\s*\d+(\.\d+)?)/);
        const expr = exprMatch ? exprMatch[0] : goal;
        
        logCollector.addAction(`calculator("${expr}")`);
        const res = await AgentTools.calculator(expr);
        logCollector.addObs(res);
        return `Result: **${res}**`;
      }

      // Time tool
      if (timeScore > searchScore) {
        logCollector.addThought(`Classified as temporal query.`);
        logCollector.addAction(`env_check()`);
        const res = await AgentTools.env_check();
        logCollector.addObs(res);
        return res;
      }

      // Knowledge Search tool (default fallback with highest general mass)
      logCollector.addThought(`Classified as external knowledge query.`);
      logCollector.addAction(`web_search("${goal}")`);
      const res = await AgentTools.web_search(goal);
      logCollector.addObs(res.slice(0, 100) + '...');
      return res;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const goal = input.value.trim();
      if (!goal) return;

      appendMessage(goal, 'user');
      input.value = '';

      statusDot.className = 'status-dot busy';
      agentState.textContent = 'Agent running...';
      submitBtn.disabled = true;

      const { logCollector, setText } = createAgentMessage();

      try {
        const result = await runNGramAgent(goal, logCollector);
        setText(result);
      } catch (err) {
        setText(`Agent error: ${err.message}`);
      } finally {
        statusDot.className = 'status-dot';
        agentState.textContent = 'Statistical Engine Ready';
        submitBtn.disabled = false;
      }
    });

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createAgentMessage() {
      const card = document.createElement('div');
      card.className = 'message agent';

      const details = document.createElement('details');
      details.className = 'thought-dropdown';
      details.open = true;

      const summary = document.createElement('summary');
      summary.innerHTML = '📊 N-Gram Agent Probability & Reasoning';
      details.appendChild(summary);

      const logContainer = document.createElement('div');
      logContainer.className = 'thought-logs';
      details.appendChild(logContainer);

      const responseEl = document.createElement('div');
      responseEl.innerHTML = '<i>Calculating probabilities...</i>';

      card.appendChild(details);
      card.appendChild(responseEl);
      chatBox.appendChild(card);
      chatBox.scrollTop = chatBox.scrollHeight;

      const logCollector = {
        addThought: (t) => addLog(`💭 ${t}`, 'log-item'),
        addAction: (a) => addLog(`🛠️ Action: ${a}`, 'log-action'),
        addObs: (o) => addLog(`👁️ Obs: ${o}`, 'log-obs')
      };

      function addLog(text, className) {
        const item = document.createElement('div');
        item.className = className;
        item.textContent = text;
        logContainer.appendChild(item);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function setText(text) {
        responseEl.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        details.open = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      return { logCollector, setText };
    }
  </script>
</body>
</html>
