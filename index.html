<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LivingGPT - Autonomous Agent Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .agent-container {
      width: 100%;
      max-width: 850px;
      height: 100%;
      height: 100dvh;
      background: #111827;
      display: flex;
      flex-direction: column;
      border: 1px solid #1f2937;
    }

    @media (min-width: 768px) {
      .agent-container {
        height: 92vh;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
    }

    .header {
      padding: 14px 18px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      flex-shrink: 0;
    }

    .status-dot.busy {
      background-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .chat-box {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }

    .agent {
      align-self: flex-start;
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Clean Agent Thought Accordion */
    details.thought-dropdown {
      background: #0d1424;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    details.thought-dropdown summary {
      cursor: pointer;
      color: #94a3b8;
      font-weight: 500;
      outline: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details.thought-dropdown summary:hover {
      color: #cbd5e1;
    }

    .thought-logs {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #1e293b;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 11px;
    }

    .log-item {
      color: #93c5fd;
      line-height: 1.4;
    }

    .log-action {
      color: #38bdf8;
    }

    .log-obs {
      color: #34d399;
    }

    .log-retry {
      color: #f97316;
    }

    .response-text {
      font-size: 14px;
      line-height: 1.5;
      color: #f8fafc;
    }

    .input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #0f172a;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }

    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="agent-container">
    <div class="header">
      <div class="agent-info">
        <div id="statusDot" class="status-dot"></div>
        <div>
          <strong style="font-size: 15px;">LivingGPT</strong>
          <div style="font-size: 11px; color: #9ca3af;" id="agentState">Autonomous loop: idle</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message agent">
        <div class="response-text">
          LivingGPT ready. Give me an objective, calculation, or query to execute.
        </div>
      </div>
    </div>

    <form class="input-area" id="agentForm">
      <input type="text" id="userInput" placeholder="Give LivingGPT an objective..." autocomplete="off" />
      <button type="submit" id="submitBtn">Execute</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const form = document.getElementById('agentForm');
    const statusDot = document.getElementById('statusDot');
    const agentState = document.getElementById('agentState');
    const submitBtn = document.getElementById('submitBtn');

    const AgentTools = {
      calculator: {
        execute: async (expr) => {
          try {
            const cleanExpr = expr.replace(/[^0-9+\-*/().]/g, '');
            const res = Function(`'use strict'; return (${cleanExpr})`)();
            return { success: true, quality: "high", output: res };
          } catch (e) {
            return { success: false, quality: "low", output: "Calculation failed" };
          }
        }
      },
      web_search: {
        execute: async (query) => {
          try {
            const endpoint = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
            const res = await fetch(endpoint);
            const data = await res.json();
            if (data.AbstractText) {
              return { success: true, quality: "high", output: data.AbstractText };
            }
            if (data.RelatedTopics && data.RelatedTopics[0]?.Text) {
              return { success: true, quality: "high", output: data.RelatedTopics[0].Text };
            }
            return { success: false, quality: "low", output: "No direct extract found" };
          } catch (err) {
            return { success: false, quality: "low", output: err.message };
          }
        }
      },
      wikipedia_lookup: {
        execute: async (query) => {
          try {
            const cleanQuery = query.replace(/(who is|what is|where is|search|lookup)/gi, '').trim();
            const endpoint = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`;
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error("Article not found");
            const data = await res.json();
            if (data.extract) {
              return { success: true, quality: "high", output: data.extract };
            }
            return { success: false, quality: "low", output: "No article summary" };
          } catch (e) {
            return { success: false, quality: "low", output: e.message };
          }
        }
      },
      env_check: {
        execute: async () => {
          return {
            success: true,
            quality: "high",
            output: `Local Time: ${new Date().toLocaleTimeString()}, Date: ${new Date().toLocaleDateString()}`
          };
        }
      }
    };

    function parseIntent(rawGoal) {
      const lower = rawGoal.trim().toLowerCase();
      const isGreeting = /^(hi|hello|hey|sup|yo|greetings|hola)\b/i.test(lower) && lower.split(/\s+/).length <= 3;

      let normalized = rawGoal
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\bplus\b/gi, '+')
        .replace(/\bminus\b/gi, '-')
        .replace(/\btimes\b|\bmultiplied by\b/gi, '*')
        .replace(/\bdivided by\b/gi, '/');

      const mathMatch = normalized.match(/(\d+(\.\d+)?\s*[\+\-\*\/]\s*\d+(\.\d+)?)/);
      const asksTime = /\b(time|date|today|clock|day)\b/i.test(rawGoal);

      return {
        isGreeting,
        isMath: !!mathMatch,
        mathExpr: mathMatch ? mathMatch[0] : null,
        isTime: asksTime,
        cleanSearch: rawGoal.replace(/^(who is|what is|search|lookup|find)\s+/i, '').trim()
      };
    }

    async function runAgentReActLoop(goal, logCollector) {
      logCollector.addThought(`Goal received: "${goal}"`);
      const intent = parseIntent(goal);
      const observations = [];

      // 1. Direct Conversational Greeting (No wasteful Hawaii search)
      if (intent.isGreeting) {
        logCollector.addThought(`Intent classified as greeting. No tool calls necessary.`);
        return "Hello! How can I assist you with your goals or tasks today?";
      }

      // 2. Math Intent
      if (intent.isMath) {
        logCollector.addThought(`Parsed arithmetic intent: "${intent.mathExpr}"`);
        logCollector.addAction(`calculator("${intent.mathExpr}")`);
        await new Promise(r => setTimeout(r, 400));

        const res = await AgentTools.calculator.execute(intent.mathExpr);
        logCollector.addObs(`calculator -> ${res.output}`);
        observations.push({ type: "math", result: `${intent.mathExpr} = ${res.output}` });
      }

      // 3. System / Temporal Intent
      if (intent.isTime) {
        logCollector.addThought(`Parsed system context query.`);
        logCollector.addAction(`env_check()`);
        await new Promise(r => setTimeout(r, 400));

        const res = await AgentTools.env_check.execute();
        logCollector.addObs(`env_check -> ${res.output}`);
        observations.push({ type: "time", result: res.output });
      }

      // 4. Knowledge Retrieval Intent
      if (!intent.isMath && !intent.isTime) {
        logCollector.addThought(`Executing knowledge retrieval for: "${intent.cleanSearch}"`);
        logCollector.addAction(`web_search("${intent.cleanSearch}")`);
        await new Promise(r => setTimeout(r, 450));

        let res = await AgentTools.web_search.execute(intent.cleanSearch);

        if (!res.success || res.quality === "low") {
          logCollector.addThought(`DuckDuckGo returned low confidence. Engaging fallback strategy.`);
          logCollector.addRetry(`wikipedia_lookup("${intent.cleanSearch}")`);
          await new Promise(r => setTimeout(r, 550));

          res = await AgentTools.wikipedia_lookup.execute(intent.cleanSearch);
        }

        if (res.success) {
          logCollector.addObs(`Found relevant extract via fallback knowledge base.`);
          observations.push({ type: "knowledge", result: res.output });
        } else {
          logCollector.addObs(`Failed to locate direct extracts across active registries.`);
          observations.push({ type: "knowledge", result: `Could not locate verified web results for "${intent.cleanSearch}".` });
        }
      }

      logCollector.addThought(`Loop completed. Synthesizing output.`);

      const parts = [];
      for (const obs of observations) {
        if (obs.type === "math") parts.push(`The answer is **${obs.result}**.`);
        else if (obs.type === "time") parts.push(`Current context: ${obs.result}.`);
        else if (obs.type === "knowledge") parts.push(obs.result);
      }
      return parts.join("\n\n");
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const goal = input.value.trim();
      if (!goal) return;

      appendMessage(goal, 'user');
      input.value = '';
      setBusy(true);

      // Create live agent response card
      const { agentCard, logCollector, setText } = createAgentMessage();

      try {
        const resultText = await runAgentReActLoop(goal, logCollector);
        setText(resultText);
      } catch (err) {
        setText(`Execution stopped: ${err.message}`);
      } finally {
        setBusy(false);
      }
    });

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createAgentMessage() {
      const card = document.createElement('div');
      card.className = 'message agent';

      const details = document.createElement('details');
      details.className = 'thought-dropdown';
      details.open = true; // Open while executing, collapses nicely

      const summary = document.createElement('summary');
      summary.innerHTML = '⚙️ Agent thought process & tools';
      details.appendChild(summary);

      const logContainer = document.createElement('div');
      logContainer.className = 'thought-logs';
      details.appendChild(logContainer);

      const responseEl = document.createElement('div');
      responseEl.className = 'response-text';
      responseEl.innerHTML = '<i>Processing...</i>';

      card.appendChild(details);
      card.appendChild(responseEl);
      chatBox.appendChild(card);
      chatBox.scrollTop = chatBox.scrollHeight;

      const logCollector = {
        addThought: (t) => addLog(`🧠 ${t}`, 'log-item'),
        addAction: (a) => addLog(`🛠️ Action: ${a}`, 'log-action'),
        addRetry: (r) => addLog(`🔄 Pivot: ${r}`, 'log-retry'),
        addObs: (o) => addLog(`👁️ Obs: ${o}`, 'log-obs'),
      };

      function addLog(text, className) {
        const item = document.createElement('div');
        item.className = className;
        item.textContent = text;
        logContainer.appendChild(item);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function setText(text) {
        responseEl.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        details.open = false; // Auto-collapse when done for clean look
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      return { agentCard: card, logCollector, setText };
    }

    function setBusy(isBusy) {
      if (isBusy) {
        statusDot.classList.add('busy');
        agentState.textContent = 'Agent executing loop...';
        submitBtn.disabled = true;
      } else {
        statusDot.classList.remove('busy');
        agentState.textContent = 'Autonomous loop: idle';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
