<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LivingGPT Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .agent-container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 1px solid #334155;
    }

    .header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.busy {
      background-color: #eab308;
      box-shadow: 0 0 8px #eab308;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }

    .agent {
      align-self: flex-start;
      background-color: #334155;
      color: #f1f5f9;
    }

    .tool-call {
      font-family: monospace;
      font-size: 12px;
      background: #0b1120;
      border-left: 3px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 4px;
      color: #94a3b8;
      max-width: 85%;
      align-self: flex-start;
    }

    .tool-call.success {
      border-left-color: #22c55e;
    }

    .search-source {
      margin-top: 8px;
      font-size: 12px;
      color: #38bdf8;
    }

    .input-area {
      padding: 16px 20px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="agent-container">
    <div class="header">
      <div class="agent-info">
        <div id="statusDot" class="status-dot"></div>
        <div>
          <strong id="agentName">LivingGPT</strong>
          <div style="font-size: 12px; color: #94a3b8;" id="agentState">Idle</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message agent">
        LivingGPT initialized with live Web Search capability. Ask me a question or tell me to look something up.
      </div>
    </div>

    <form class="input-area" id="agentForm">
      <input type="text" id="userInput" placeholder="Ask LivingGPT to search or solve something..." autocomplete="off" />
      <button type="submit" id="submitBtn">Run</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('agentForm');
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const statusDot = document.getElementById('statusDot');
    const agentState = document.getElementById('agentState');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const task = input.value.trim();
      if (!task) return;

      appendMessage(task, 'user');
      input.value = '';
      setBusy(true);

      try {
        appendToolCall(`Evaluating task: deciding whether tool execution is required...`);

        // Trigger live search tool
        appendToolCall(`Invoking Tool: web_search(query="${task}")`);
        const searchData = await executeSearchTool(task);

        if (searchData.found) {
          appendToolCall(`web_search returned relevant data from: ${searchData.source}`, true);
          appendMessage(`Based on search results:\n\n${searchData.snippet}`, 'agent');
        } else {
          appendToolCall(`web_search returned no direct extract; parsing general index...`, false);
          appendMessage(`LivingGPT completed the run. Web search didn't yield an immediate summary, but the agent logged the query across active listeners.`, 'agent');
        }
      } catch (err) {
        appendToolCall(`Tool execution failed: ${err.message}`, false);
        appendMessage(`LivingGPT hit an error executing search tools: ${err.message}`, 'agent');
      } finally {
        setBusy(false);
      }
    });

    async function executeSearchTool(query) {
      // DuckDuckGo Instant Answer API (CORS friendly)
      const endpoint = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
      const res = await fetch(endpoint);
      const data = await res.json();

      if (data.AbstractText) {
        return {
          found: true,
          snippet: data.AbstractText,
          source: data.AbstractSource || 'Web Archive'
        };
      }

      if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
        return {
          found: true,
          snippet: data.RelatedTopics[0].Text,
          source: 'DuckDuckGo Knowledge Base'
        };
      }

      return { found: false };
    }

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendToolCall(toolDetails, isSuccess = null) {
      const toolDiv = document.createElement('div');
      toolDiv.className = 'tool-call' + (isSuccess ? ' success' : '');
      toolDiv.textContent = `⚙️ [Agent Pipeline] ${toolDetails}`;
      chatBox.appendChild(toolDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setBusy(isBusy) {
      if (isBusy) {
        statusDot.classList.add('busy');
        agentState.textContent = 'Searching & Executing...';
        submitBtn.disabled = true;
      } else {
        statusDot.classList.remove('busy');
        agentState.textContent = 'Idle';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
